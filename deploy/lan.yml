# Сервер в локальной сети клуба, без домена и HTTPS.
#
#   docker compose -f docker-compose.yml -f deploy/lan.yml up -d
#
# Так ставят на пилот: сервер стоит в самом зале, машины подключаются к нему по
# внутреннему адресу вида http://192.168.1.50:8080. Сертификат на такой адрес
# не выдаётся, поэтому HTTPS здесь не будет — данные не покидают локальную сеть
# клуба, но и защиты от того, кто уже внутри неё, нет.
#
# Для боевой установки на домен этот файл не нужен: обычный docker compose up
# поднимает всё за автоматическим HTTPS.

services:
  web:
    environment:
      # Двоеточие без имени — Caddy слушает порт на всех адресах по HTTP.
      CYBERFOX_DOMAIN: ":8080"
    # !override, а не добавление: иначе к списку добавились бы 80 и 443 из
    # основного файла, а они на рабочем ноутбуке часто заняты.
    ports: !override
      - "8080:8080"
