# Развёртывание Cyber-Fox на одной машине.
#
# Поднимает всё, что нужно клубу: база, сервер, кассовый экран за HTTPS и
# ежедневный бэкап. Настройки — в файле .env рядом (см. deploy/env.example).
#
#   cp deploy/env.example .env && ${EDITOR:-nano} .env
#   docker compose up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Без ограничения журнал докера растёт бесконечно и съедает диск мини-ПК
    # за несколько месяцев работы зала.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberfox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте пароль базы в .env}
      POSTGRES_DB: ${POSTGRES_DB:-cyberfox}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Наружу база не смотрит: к ней ходят только сервер и бэкап по внутренней
    # сети compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberfox}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # Без ограничения журнал докера растёт бесконечно и съедает диск мини-ПК
    # за несколько месяцев работы зала.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyberfox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyberfox}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      PAYMENT_CHECKOUT_URL: ${PAYMENT_CHECKOUT_URL:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      TZ: ${TZ:-Asia/Almaty}
    # Проверяется не порт, а ответ вместе с базой: подвисший на базе сервер
    # держит порт открытым, но зал с него ни посадить, ни списать не может.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    # Без ограничения журнал докера растёт бесконечно и съедает диск мини-ПК
    # за несколько месяцев работы зала.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      - server
    environment:
      CYBERFOX_DOMAIN: ${CYBERFOX_DOMAIN:?укажите домен клуба в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Бэкап базы. Без него первая же потерянная машина означает потерянные
  # балансы гостей, а их клуб восстановить не сможет ничем.
  # Бэкап базы. Без него первая же потерянная машина означает потерянные
  # балансы гостей, а их клуб восстановить не сможет ничем.
  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-cyberfox}
      POSTGRES_DB: ${POSTGRES_DB:-cyberfox}
      TZ: ${TZ:-Asia/Almaty}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Открытый ключ получателя: им шифруется копия перед отправкой наружу.
      # Закрытый ключ хранится у владельца отдельно от клуба — потеряете его,
      # потеряете и все копии.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Внешнее хранилище. Пусто — копии остаются только на этой машине, и её
      # потеря означает потерю балансов гостей.
      OFFSITE_HOST: ${OFFSITE_HOST:-}
      OFFSITE_USER: ${OFFSITE_USER:-}
      OFFSITE_PORT: ${OFFSITE_PORT:-23}
      OFFSITE_PATH: ${OFFSITE_PATH:-./cyberfox/}
    volumes:
      - ./backups:/backups
      # Ключ только на чтение. По умолчанию подставляется пустая заглушка:
      # без неё docker создал бы на месте файла папку, и запуск падал бы у
      # клубов, которые внешним хранилищем не пользуются.
      - ${OFFSITE_KEY:-./deploy/backup/offsite-key.none}:/keys/offsite:ro

volumes:
  db-data:
  caddy-data:
  caddy-config:
