# Проверка каждого коммита.
#
# Три работы намеренно разделены. Первая ловит поломки кода за минуту, вторая
# гоняет миграции по настоящему Postgres — до сих пор их проверяли только
# глазами, — третья собирает установщик агента на живой Windows, а не через
# wine с мака.

name: Проверка

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  code:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Клиент Prisma нужен до проверки типов: без него сервер не компилируется.
      - run: pnpm --filter @cyberfox/server prisma:generate

      - run: pnpm typecheck
      # --if-present: тесты есть у сервера и агента, у кассы и общих типов их нет.
      - run: pnpm -r --if-present test
      - run: pnpm build

  migrations:
    name: Миграции на живой базе
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cyberfox
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/cyberfox

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cyberfox/server prisma:generate

      # Ровно то, что делает клуб при первом запуске: пустая база и все
      # миграции подряд.
      - name: Прогнать все миграции с нуля
        run: pnpm --filter @cyberfox/server exec prisma migrate deploy

      # Схема и миграции разъезжаются молча: правку модели легко закоммитить,
      # забыв миграцию, и упрётся в это клуб, а не разработчик.
      - name: Сверить схему с миграциями
        run: |
          pnpm --filter @cyberfox/server exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "схема совпадает" || {
              echo "::error::Схема Prisma разошлась с миграциями — не хватает миграции"
              exit 1
            }

      - name: Заполнить демо-данными
        run: pnpm --filter @cyberfox/server seed

      # Изоляция сетей проверяется на живой базе: правила пишутся на SQL, и
      # ошибка в них не видна ни типам, ни тестам. Заводим две сети и убеждаемся,
      # что под настройкой одной вторая не видна вовсе.
      - name: Проверить, что сети не видят друг друга
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Tenant" (id, name, "updatedAt") VALUES
            ('11111111-1111-1111-1111-111111111111', 'Первая сеть', now()),
            ('22222222-2222-2222-2222-222222222222', 'Вторая сеть', now());
          INSERT INTO "Club" (id, "tenantId", name, "updatedAt") VALUES
            ('aaaaaaaa-1111-1111-1111-111111111111', '11111111-1111-1111-1111-111111111111', 'Зал первой', now()),
            ('bbbbbbbb-2222-2222-2222-222222222222', '22222222-2222-2222-2222-222222222222', 'Зал второй', now());
          SQL

          own=$(psql -tA "$DATABASE_URL" -c "
            BEGIN;
            SELECT set_config('app.tenant_id', '11111111-1111-1111-1111-111111111111', true);
            SELECT count(*) FROM \"Club\" WHERE name LIKE 'Зал %';
            COMMIT;" | tail -2 | head -1)

          echo "клубов видно под первой сетью: $own"
          test "$own" = "1"

          foreign=$(psql -tA "$DATABASE_URL" -c "
            BEGIN;
            SELECT set_config('app.tenant_id', '11111111-1111-1111-1111-111111111111', true);
            SELECT count(*) FROM \"Club\" WHERE id = 'bbbbbbbb-2222-2222-2222-222222222222';
            COMMIT;" | tail -2 | head -1)

          echo "чужих клубов видно: $foreign"
          test "$foreign" = "0"

      # Бэкап, который никто не восстанавливал, — не бэкап. Проверка снимает
      # копию так же, как ночной контейнер в клубе, и разворачивает её в чистую
      # базу, сверяя, что клуб и гости на месте.
      - name: Снять копию и восстановить её в чистую базу
        run: |
          docker build -f deploy/backup/Dockerfile -t cyberfox-backup .
          PGPASSWORD=ci pg_dump -h localhost -U postgres -d cyberfox > /tmp/dump.sql
          psql "postgresql://postgres:ci@localhost:5432/postgres" -c 'CREATE DATABASE restored'
          psql "postgresql://postgres:ci@localhost:5432/restored" -f /tmp/dump.sql > /dev/null
          clubs=$(psql -tA "postgresql://postgres:ci@localhost:5432/restored" -c 'SELECT count(*) FROM "Club"')
          guests=$(psql -tA "postgresql://postgres:ci@localhost:5432/restored" -c 'SELECT count(*) FROM "Guest"')
          echo "в восстановленной базе клубов: $clubs, гостей: $guests"
          test "$clubs" -ge 1 && test "$guests" -ge 1

  installer:
    name: Установщик агента
    runs-on: windows-latest
    # Право писать в репозиторий нужно, только чтобы приложить готовый файл к
    # выпуску. По умолчанию сборке дан лишь доступ на чтение, и выкладка
    # отвечала отказом уже после успешной сборки.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Агент собирается своим npm-установом внутри своей папки, а не общим
      # pnpm по всему монорепозиторию. Причина конкретная: electron-builder на
      # этапе «installing production dependencies» переустанавливает зависимости
      # приложения у себя, и на Windows это ломает плоскую раскладку pnpm —
      # сборщик теряет собственный app-builder.exe и падает с ENOENT. Агент ни
      # от чего в монорепозитории не зависит, поэтому отдельная установка ему
      # ничего не стоит.
      - name: Установить зависимости агента
        working-directory: apps/agent
        run: npm install --no-audit --no-fund

      - name: Собрать экран и основной процесс
        working-directory: apps/agent
        run: npm run build

      - name: Собрать установщик
        working-directory: apps/agent
        run: npx electron-builder --win --publish never

      # Готовый файл забирают из вкладки Actions: в зал уходит ссылка, а не
      # пересылка 78 мегабайт через мессенджер.
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-fox-agent-setup
          path: apps/agent/release/*.exe
          if-no-files-found: error
          retention-days: 30

      # Клуб не должен заходить в GitHub, чтобы получить установщик: артефакты
      # сборки требуют входа. По тегу файл уходит в релиз, откуда качается
      # прямой ссылкой, одинаковой для всех выпусков:
      #   github.com/aliaskarov007/cyber-Fox/releases/latest/download/CyberFoxAgentSetup.exe
      - name: Выложить установщик в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/agent/release/CyberFoxAgentSetup.exe
          generate_release_notes: true
