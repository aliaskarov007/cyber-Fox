# Установщик агента для игровых машин.
#
#   pnpm --filter @cyberfox/agent pack:win
#
# Собирается на Windows. Из Linux сборка тоже возможна (electron-builder умеет
# делать это через wine), но подписать исполняемый файл там нечем, а
# неподписанный агент Windows встречает предупреждением SmartScreen на каждой
# из сорока машин.

appId: kz.cyberfox.agent
productName: Cyber-Fox Agent
copyright: Cyber-Fox

# Версия указана явно, потому что в этом репозитории плоская раскладка
# зависимостей (node-linker=hoisted): electron лежит в корне монорепозитория,
# а сборщик ищет его в node_modules самого приложения и не находит.
# При обновлении electron в package.json обновите и здесь.
electronVersion: 33.4.11

# Имя файла без версии и пробелов. Ссылка на скачивание стоит в кассе и в
# инструкции, и меняться при каждом выпуске она не должна; пробелы в имени
# ломают половину способов скачать файл в консоли.
artifactName: CyberFoxAgentSetup.${ext}

directories:
  output: release
  buildResources: build

# Откуда агент берёт новые версии: тот же выпуск, откуда его скачивают руками.
# Репозиторий открытый, поэтому машине зала не нужен ни ключ, ни учётная запись.
publish:
  provider: github
  owner: aliaskarov007
  repo: cyber-Fox

files:
  - dist/**/*
  - package.json

# Установщик копируют на каждую машину зала по локальной сети, поэтому размер
# стоит времени сборки один раз, а не сорока копирований.
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  # Агент не запрашивает прав администратора: блокировка ему их не требует,
  # а лишний запрос UAC при каждом входе в систему сделал бы автозапуск
  # бесполезным.
  requestedExecutionLevel: asInvoker

nsis:
  # Свои шаги установки: закрыть работающего агента и придержать сторожа.
  # Без них установка поверх встаёт на «Не удалось закрыть Cyber-Fox Agent»:
  # агент отказывается закрываться, пока держит блокировку.
  include: build/installer.nsh
  # Ставим на всю машину: за одним ПК в зале сидят разные пользователи
  # Windows, и агент должен встречать каждого.
  perMachine: true
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Cyber-Fox
  # После установки агент запускается сразу: администратор тут же вводит код
  # привязки и видит, что машина появилась в зале.
  runAfterFinish: true
  installerLanguages:
    - ru_RU
  language: "1049"
